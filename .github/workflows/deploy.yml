name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup PHP & Composer
      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, zip, bcmath, fileinfo, gd
          coverage: none

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      # 2. Setup Node.js & Compile Assets (Vite)
      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔨 Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      # 3. Bersihkan file yang tidak diperlukan di server
      - name: 🧹 Cleanup Unnecessary Files
        run: |
          rm -rf node_modules
          rm -rf .github
          rm -rf tests

      # 4. Sync Files via Rsync over SSH (Password Auth)
      - name: 🚀 Sync Files via Rsync over SSH
        env:
          SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          TARGET_DIR: ${{ secrets.HOSTINGER_TARGET_DIR || 'public_html' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -avz --delete \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude="/.git/" \
            --exclude="/.github/" \
            --exclude="/.env" \
            --exclude="/node_modules/" \
            --exclude="/tests/" \
            --exclude="/storage/logs/*" \
            --exclude="/storage/framework/cache/*" \
            --exclude="/storage/framework/sessions/*" \
            --exclude="/storage/framework/views/*" \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR"

      # 5. Jalankan Artisan Commands di Hostinger via SSH
      - name: ⚙️ Run Post-Deployment Commands on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            cd ${{ secrets.HOSTINGER_TARGET_DIR || 'public_html' }}
            
            # Buat link storage jika belum ada
            php artisan storage:link || true
            
            # Jalankan database migrations
            php artisan migrate --force
            
            # Optimasi cache Laravel
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Set permission folder storage & cache
            chmod -R 775 storage bootstrap/cache
