name: Deploy Laravel to Hostinger (FTP Method)

on:
  workflow_dispatch: # Jalankan secara manual jika ingin menggunakan metode FTP

jobs:
  deploy-ftp:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup PHP & Composer (Build Vendor)
      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, zip, bcmath, fileinfo, gd
          coverage: none

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      # 2. Setup Node.js & Compile Assets (Vite)
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      # 3. Hapus folder yang tidak perlu diupload
      - name: 🧹 Cleanup Development Files
        run: |
          rm -rf node_modules
          rm -rf .github
          rm -rf tests

      # 4. Deploy via FTP
      - name: 🚀 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # Atau ftp jika tidak menggunakan FTPS
          port: 21
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env*
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
